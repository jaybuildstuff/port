<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jay Merete | Portfolio</title>
  <meta name="description" content="The creative portfolio of Jay Merete: filmmaker, creative director, writer, and more." />
  
  <!-- Tailwind config BEFORE CDN, dark mode enabled -->
  <script>
    window.tailwind = {
      config: {
        darkMode: 'class',
        theme: {
          fontFamily: {
            sans: ['"Satoshi"', 'system-ui', 'sans-serif'],
          },
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fontshare Import -->
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap" rel="stylesheet">

  <!-- Grainy SVG BG, Soft Gradient BG -->
  <style>
    html, body {
      min-height: 100%;
      scroll-behavior: smooth;
      transition: background 0.5s, color 0.5s;
    }
    body {
      font-family: 'Satoshi', sans-serif;
      background:
        linear-gradient(135deg, rgba(245,245,245,0.9) 0%, rgba(225,210,255,0.7) 100%),
        url("data:image/svg+xml,%3Csvg width='200' height='200' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='200' height='200' fill='%23fff' fill-opacity='.01'/%3E%3Ccircle cx='100' cy='100' r='1.2' fill='%23000000' fill-opacity='.06'/%3E%3C/svg%3E");
      background-attachment: fixed;
    }
    html.dark body {
      background:
        linear-gradient(135deg, rgba(15,15,23,1) 0%, rgba(32,25,58,0.93) 100%),
        url("data:image/svg+xml,%3Csvg width='200' height='200' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='200' height='200' fill='%230e0e17' fill-opacity='.02'/%3E%3Ccircle cx='100' cy='100' r='1.4' fill='%23fff' fill-opacity='.07'/%3E%3C/svg%3E");
      background-attachment: fixed;
    }
    /* Subtle morph animation for portrait */
    .morph-portrait {
      transition: border-radius 1.5s cubic-bezier(.85,-0.7,.54,1.62), box-shadow .7s;
      border-radius: 63% 37% 53% 47% / 47% 52% 48% 53%;
      box-shadow: 0 14px 44px 0 rgba(32,19,53,.19);
      overflow: hidden;
      backdrop-filter: blur(1.5px);
      will-change: border-radius;
    }
    .morph-portrait:hover {
      border-radius: 55% 45% 34% 66% / 41% 61% 39% 59%;
      box-shadow: 0 24px 64px 0 rgba(70,40,120,.16);
    }
    /* Smooth icon morph (sun/moon) with stroke-dash for minimal look */
    .theme-icon {
      transition: stroke 0.7s cubic-bezier(.3,2.5,.48,1.37), fill 0.7s cubic-bezier(.41,1.68,.57,.99);
      stroke: currentColor;
      fill: none;
      width: 1.55em;
      height: 1.55em;
      display: block;
    }
    /* Availability badge styling */
    .availability-pill {
      font-size: 0.9rem;
      padding: 0.25rem 1.05rem;
      border-radius: 1.5em;
      font-weight: 500;
      background: linear-gradient(90deg, #b2ffd3 0%, #45a16a 100%);
      color: #094337;
      letter-spacing: 0.05em;
      box-shadow: 0 1.5px 9px 0 rgba(95,183,121,.045);
      display: inline-block;
      transition: background .3s,color .3s;
      position: relative;
    }
    html.dark .availability-pill {
      background: linear-gradient(90deg, #002311 0%, #45a16a 100%);
      color: #c2ffde;
      box-shadow: 0 2.5px 13px 0 rgba(95,183,121,.062);
    }
    /* Telegram floating button */
    .floating-telegram {
      position: fixed;
      z-index: 51;
      top: 2.1rem;
      right: 2.1rem;
      background: rgba(245,245,245,0.32);
      backdrop-filter: blur(5px);
      border-radius: 2em;
      box-shadow: 0 2px 16px 0 rgba(90,60,120,.055);
      color: #2a60d7;
      padding: 0.8em 1.3em 0.75em 1.3em;
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 500;
      font-size: 1.12rem;
      transition: background .32s, color .32s, box-shadow .32s;
      text-decoration: none;
      cursor: pointer;
    }
    .floating-telegram:hover {
      background: rgba(214,232,255,0.55);
      color: #176e9c;
      box-shadow: 0 7px 32px 0 rgba(60,114,250,0.13);
    }
    html.dark .floating-telegram {
      background: rgba(22,34,56,0.71);
      color: #67b6fc;
    }
    html.dark .floating-telegram:hover {
      background: rgba(22,34,56,0.91);
      color: #44aff7;
    }
    /* Custom tooltip on Telegram button */
    .floating-telegram span {
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s;
      position: absolute;
      top: 125%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.95em;
      color: #404040;
      background: #fcfcfc;
      padding: .55em .85em;
      border-radius: 1em;
      box-shadow: 0 2px 8px rgba(55,44,72,0.09);
      white-space: nowrap;
      z-index: 99;
    }
    .floating-telegram:hover span {
      opacity: 1;
    }
    html.dark .floating-telegram span {
      color: #bfeaff;
      background: #1e2329;
    }
    /* Fading section appear */
    .section-fade {
      opacity: 0;
      transform: translateY(36px);
      transition: opacity 1.1s, transform 1.1s;
      will-change: opacity,transform;
    }
    .section-fade.visible {
      opacity: 1;
      transform: translateY(0);
    }
    /* Social dot icon effect */
    .social-link {
      position: relative;
      width: 1.5em;
      height: 1.5em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 100vw;
      transition: background .19s;
      color: #444;
    }
    .social-link:hover {
      color: #0055be;
      background: rgba(45, 61, 160, 0.09);
    }
    html.dark .social-link {
      color: #ccc;
    }
    html.dark .social-link:hover {
      color: #77cfff;
    }
  </style>
</head>
<body class="relative min-h-screen pb-16">

  <!-- Social Links -->
  <header class="fixed top-0 left-0 w-full flex justify-between z-50 pointer-events-none">
    <div class="p-7 pl-9 flex gap-3 pointer-events-auto">
      <a href="https://instagram.com/jay.merete" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Instagram">
        <!-- Custom minimal Instagram SVG -->
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" class="w-5 h-5">
          <rect x="4.7" y="4.7" width="14.6" height="14.6" rx="4.3" stroke="currentColor"/>
          <circle cx="12" cy="12" r="4" stroke="currentColor"/>
          <circle cx="17" cy="7" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="mailto:yididyamerete@gmail.com" class="social-link" aria-label="Email">
        <!-- Minimal mail SVG -->
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" class="w-5 h-5">
          <rect x="3.5" y="6" width="17" height="12" rx="2.8" stroke="currentColor"/>
          <path d="M5 8l7 5.5L19 8" stroke="currentColor"/>
        </svg>
      </a>
    </div>
    <!-- Theme toggle (right) -->
    <div class="p-7 pr-9 pointer-events-auto">
      <button id="themeToggle"
        class="inline-flex items-center justify-center rounded-full border border-gray-200 dark:border-gray-800 shadow-sm transition-all bg-white/50 dark:bg-zinc-900/70 hover:bg-zinc-100 dark:hover:bg-zinc-700 w-[2.7em] h-[2.7em] min-w-[2.7em] min-h-[2.7em] focus:outline-none focus:ring-2 focus:ring-cyan-400"
        aria-label="Toggle dark mode"
        type="button">
        <!-- Custom morph sun/moon -->
        <svg id="themeIcon" viewBox="0 0 24 24" class="theme-icon">
          <!-- Sun+moon shape (morphs using JS) -->
        </svg>
      </button>
    </div>
  </header>

  <!-- Write a Message (Telegram) -->
  <a href="https://t.me/YOUR_TELEGRAM_HERE" target="_blank" rel="noopener noreferrer" class="floating-telegram" aria-label="Write me a message on Telegram" style="pointer-events:auto;">
    <svg viewBox="0 0 26 26" fill="none" stroke-width="1.8" style="width:1.3em; height:1.3em;stroke:currentColor;">
      <circle cx="13" cy="13" r="12.2" stroke="currentColor" fill="none"/>
      <path d="M7 13l4.1 3.3c.2.2.6.2.7 0l6.1-7.6" stroke="currentColor" stroke-linecap="round"/>
    </svg>
    <span>Write me a message!</span>
  </a>

  <!-- Hero Section -->
  <section class="flex flex-col md:flex-row items-center justify-center mt-36 section-fade" style="gap:3rem; min-height: 70vh;">
    <!-- Portrait & name -->
    <div class="flex flex-col items-center md:items-start z-10">
      <div class="morph-portrait w-48 h-64 bg-zinc-300 dark:bg-zinc-700 flex items-center justify-center shadow-2xl group transition-all relative">
        <!-- Replace src with your image file -->
        <img src="your-photo.jpg" alt="Jay Merete, portrait" class="w-full h-full object-cover object-top transition-all duration-700 group-hover:scale-105" style="aspect-ratio:3/4;"/>
      </div>
      <h1 class="mt-8 mb-2 text-4xl md:text-5xl font-bold tracking-tight leading-none text-zinc-800 dark:text-zinc-100 drop-shadow-sm">
        Jay Merete
      </h1>
      <div class="availability-pill mt-1" id="availablePill" role="status" aria-live="polite">
        Available for hire
      </div>
    </div>
    <!-- Bio & extras -->
    <div class="max-w-lg w-full ml-0 md:ml-8 space-y-8 md:space-y-10 flex-1">
      <div class="pl-1 mt-10 md:mt-0">
        <p class="text-lg text-zinc-700 dark:text-zinc-300 font-normal leading-relaxed mb-4">
          Visual storyteller & creative mind — blending reality and dreams into unique narratives.<br />
          I direct, write, coordinate, and guide stories across television, commercial, and visual spaces.
        </p>
        <!-- Placeholder for location, stat, or a fun fact if you like -->
        <div class="mt-1 flex flex-row items-center gap-4">
          <span class="inline-block px-2.5 py-1 text-xs rounded-lg bg-zinc-200/80 dark:bg-zinc-700/60 text-zinc-900 dark:text-zinc-100">Addis Ababa, Ethiopia</span>
        </div>
      </div>
      <!-- Add spots for "dream" or other fun facts here if you like -->
    </div>
  </section>

  <!-- JS for theme toggle and fade-in -->
  <script>
    // Custom minimal morph sun/moon
    const SUN = `<circle cx="12" cy="12" r="5" stroke="currentColor" fill="none"/><g stroke="currentColor"><line x1="12" y1="3" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="3" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="21" y2="12"/><line x1="5.8" y1="5.8" x2="7.6" y2="7.6"/><line x1="16.4" y1="16.4" x2="18.2" y2="18.2"/><line x1="5.8" y1="18.2" x2="7.6" y2="16.4"/><line x1="16.4" y1="7.6" x2="18.2" y2="5.8"/></g>`;
    const MOON = `<path d="M19 16c-3 .7-8.7.7-8.7-7.5 0-3.5 2.8-5.6 5.3-6.2C7.7 2.9 2 8.2 2 14.5A10.5 10.5 0 0012.5 25c6.3 0 11.6-5.7 11.5-12.6-1.6 1.6-4.1 2.5-5 3.6z" stroke="currentColor" fill="none" />`;

    document.addEventListener("DOMContentLoaded", function () {
      // THEME TOGGLE
      const toggleBtn = document.getElementById("themeToggle");
      const icon = document.getElementById("themeIcon");
      const html = document.documentElement;
      const storage = localStorage;
      // Initial load
      function setTheme(mode) {
        if (mode === "dark") {
          html.classList.add("dark");
          icon.innerHTML = MOON;
        } else {
          html.classList.remove("dark");
          icon.innerHTML = SUN;
        }
      }
      // Startup: load from storage or prefers-color-scheme
      let savedTheme = storage.getItem("theme");
      if (!savedTheme) {
        savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
      }
      setTheme(savedTheme);
      // Toggle logic
      toggleBtn.addEventListener("click", () => {
        if (html.classList.contains("dark")) {
          setTheme("light");
          storage.setItem("theme", "light");
        } else {
          setTheme("dark");
          storage.setItem("theme", "dark");
        }
      });

      // FADE-IN effect
      document.querySelectorAll('.section-fade').forEach((el,i) => {
        setTimeout(() => el.classList.add('visible'), 100 + i*150);
      });
    });
  </script>
</body>
</html>
