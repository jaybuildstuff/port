<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jay Merete | Portfolio</title>
  <meta name="description" content="The creative portfolio of Jay Merete: filmmaker, creative director, writer, and more." />
  <!-- Tailwind config: extend.colors for neutrals -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neutral: {
              50:  "#fafbfc",
              100: "#f8f8f9",
              200: "#ececf0",
              300: "#e5e5e7",
              400: "#b4b4b7",
              500: "#7c7c80",
              600: "#54545a",
              700: "#333338",
              800: "#222225",
              900: "#111111"
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap" rel="stylesheet">
  <style>
    body { background: #f8f8f9; color: #111111; }
    html.dark body { background: #0f0f17; color: #fafafa; }
    .section-fade {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .7s cubic-bezier(.4,0,.2,1), transform .7s cubic-bezier(.4,0,.2,1);
    }
    .section-fade.visible { opacity: 1; transform: translateY(0);}
    .floating-cta {
      position: fixed;
      z-index: 60;
      bottom: 1.2rem;
      right: 1.2rem;
      display: flex;
      align-items: center;
      gap: .5em;
      background: #fff;
      border: 1px solid #e5e5e7;
      color: #111111;
      padding: .5em 1em;
      border-radius: 2em;
      font-weight: 500;
      font-size: 1.07rem;
      box-shadow: 0 2px 8px 0 rgba(110,110,110,.04);
      text-decoration: none;
      transition: background .18s, color .18s, box-shadow .18s, border .18s;
    }
    .floating-cta:hover {
      background: #f8f8f9;
      color: #111111;
      border-color: #ececf0;
      box-shadow: 0 4px 16px 0 rgba(120,120,120,.06);
    }
    html.dark .floating-cta {
      background: #111;
      border: 1px solid #222225;
      color: #fafafa;
      box-shadow: 0 3px 10px 0 rgba(25,25,25,.04);
    }
    html.dark .floating-cta:hover {
      color: #fafafa;
      border-color: #333338;
      background: #222225;
      box-shadow: 0 5px 16px 0 rgba(44,44,77,.07);
    }
    @media (max-width: 640px) {
      .floating-cta { bottom: .66rem; right: .66rem; font-size: .98rem; padding: .43em .69em; }
    }
  </style>
</head>
<body class="font-sans min-h-screen">

  <!-- Header: minimal social + phone -->
  <header class="fixed top-0 left-0 w-full flex justify-between z-40 pointer-events-none">
    <div class="p-6 pl-8 flex gap-3 pointer-events-auto">
      <a href="https://instagram.com/jay.merete"
        target="_blank" rel="noopener noreferrer"
        aria-label="Instagram"
        class="text-neutral-600 hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-neutral-100 transition-colors duration-200">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" class="w-5 h-5"><rect x="4.7" y="4.7" width="14.6" height="14.6" rx="4.3" stroke="currentColor"/><circle cx="12" cy="12" r="4" stroke="currentColor"/><circle cx="17" cy="7" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="mailto:yididyamerete@gmail.com"
        aria-label="Email"
        class="text-neutral-600 hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-neutral-100 transition-colors duration-200">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" class="w-5 h-5"><rect x="3.5" y="6" width="17" height="12" rx="2.8" stroke="currentColor"/><path d="M5 8l7 5.5L19 8" stroke="currentColor"/></svg>
      </a>
      <a href="tel:0962090848"
        aria-label="Phone"
        class="text-neutral-600 hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-neutral-100 transition-colors duration-200">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" class="w-5 h-5">
          <path d="M6.82 3.98l2.01 2.01a.99.99 0 01-.21 1.61l-1.14.66A13.12 13.12 0 0017.77 17.77l.66-1.14a.99.99 0 011.61-.21l2.01 2.01a1.01 1.01 0 01-1.14 1.61C17.2 20.99 13.07 18.65 9.90 15.47 6.73 12.3 4.39 8.17 4.01 3.98a1.01 1.01 0 011.61-1.14z" stroke="currentColor"/>
        </svg>
      </a>
    </div>
    <div class="p-6 pr-8 pointer-events-auto">
      <button id="themeToggle"
        class="inline-flex items-center justify-center rounded-full border border-neutral-200 dark:border-neutral-800 transition-all bg-white/80 dark:bg-neutral-900/90 hover:bg-neutral-100 dark:hover:bg-neutral-700 w-[2.5em] h-[2.5em] min-w-[2.5em] min-h-[2.5em] focus:outline-none focus:ring-2 focus:ring-neutral-300 dark:focus:ring-neutral-700"
        aria-label="Toggle dark mode"
        type="button">
        <svg id="themeIcon" viewBox="0 0 24 24" class="theme-icon text-neutral-700 dark:text-neutral-100"></svg>
      </button>
    </div>
  </header>

  <!-- Floating chat CTA -->
  <a href="https://t.me/jaymerete"
    target="_blank" rel="noopener noreferrer"
    class="floating-cta"
    aria-label="Message me">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" class="w-[20px] h-[20px] text-neutral-700 dark:text-neutral-200">
      <rect x="2.5" y="3.5" width="19" height="16" rx="4.2" stroke="currentColor"/>
      <path d="M7.5 8.5h9m-9 4h6" stroke="currentColor" stroke-linecap="round"/>
    </svg>
    <span class="text-base md:text-[1.03rem] text-neutral-600 dark:text-neutral-300 font-medium">Message me</span>
  </a>

  <!-- Portfolio Hero -->
  <main class="flex flex-1 flex-col items-center justify-center w-full px-4 pt-24 sm:pt-24 relative z-10">
    <section class="w-full max-w-4xl mx-auto flex flex-col md:flex-row items-center md:items-start gap-12 section-fade">
      <!-- Portrait & name -->
      <div class="flex flex-col items-center md:items-start flex-shrink-0 w-full md:w-auto">
        <div class="w-52 h-52 md:w-56 md:h-56 rounded-full bg-neutral-200 dark:bg-neutral-700 flex items-center justify-center shadow transition-transform duration-300 hover:scale-[1.04]">
          <img src="your-photo.jpg" alt="Jay Merete, portrait"
            class="w-full h-full object-cover object-top rounded-full"/>
        </div>
        <h1 class="mt-8 mb-1 text-5xl md:text-6xl font-bold tracking-tight leading-none text-neutral-900 dark:text-neutral-100 text-center md:text-left">
          Jay Merete
        </h1>
        <div class="mb-3 text-sm tracking-wide text-neutral-400 dark:text-neutral-400 font-normal text-center md:text-left">
          Creative Director, Filmmaker, Writer
        </div>
        <div class="text-sm text-neutral-400 dark:text-neutral-400 text-center md:text-left">
          Addis Ababa, Ethiopia
        </div>
      </div>
      <!-- Bio & extras -->
      <div class="flex-1 flex flex-col justify-center items-center md:items-start w-full md:w-auto">
        <p class="mt-4 md:mt-2 mb-2 text-base md:text-lg text-neutral-600 dark:text-neutral-300 font-normal leading-relaxed text-center md:text-left">
          Visual storyteller & creative mind — blending reality and dreams into unique narratives.
          <br/>
          I direct, write, coordinate, and guide stories across television, commercial, and visual spaces.
        </p>
      </div>
    </section>
  </main>

  <script>
    const SUN = `<circle cx="12" cy="12" r="5" stroke="currentColor" fill="none"/><g stroke="currentColor"><line x1="12" y1="3" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="3" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="21" y2="12"/><line x1="5.8" y1="5.8" x2="7.6" y2="7.6"/><line x1="16.4" y1="16.4" x2="18.2" y2="18.2"/><line x1="5.8" y1="18.2" x2="7.6" y2="16.4"/><line x1="16.4" y1="7.6" x2="18.2" y2="5.8"/></g>`;
    const MOON = `<path d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" stroke="currentColor" fill="none"/>`;
    document.addEventListener("DOMContentLoaded", function () {
      const toggleBtn = document.getElementById("themeToggle");
      const icon = document.getElementById("themeIcon");
      const html = document.documentElement;
      const storage = localStorage;
      function setTheme(mode) {
        if (mode === "dark") { html.classList.add("dark"); icon.innerHTML = MOON; }
        else { html.classList.remove("dark"); icon.innerHTML = SUN; }
      }
      let savedTheme = storage.getItem("theme");
      if (!savedTheme) {
        savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
      }
      setTheme(savedTheme);
      toggleBtn.addEventListener("click", () => {
        if (html.classList.contains("dark")) { setTheme("light"); storage.setItem("theme", "light"); }
        else { setTheme("dark"); storage.setItem("theme", "dark"); }
      });
      document.querySelectorAll('.section-fade').forEach((el,i)=>setTimeout(()=>el.classList.add('visible'), 80+i*90));
    });
  </script>
</body>
</html>
