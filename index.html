<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jay Merete | Portfolio</title>
  <meta name="description" content="The creative portfolio of Jay Merete: filmmaker, creative director, writer, and more." />

  <!-- Correct Tailwind CDN config; MUST be tailwind.config, not window.tailwind -->
  <script>
    tailwind = { config: {
      darkMode: 'class',
      theme: {
        fontFamily: {
          sans: ['"Satoshi"', 'system-ui', 'sans-serif'],
        }
      }
    }};
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap" rel="stylesheet">

  <style>
    html, body {
      min-height: 100%;
      scroll-behavior: smooth;
      transition: background 0.5s, color 0.5s;
    }
    body {
      font-family: 'Satoshi', sans-serif;
      background:
        linear-gradient(135deg, rgba(245,245,245,0.9) 0%, rgba(225,210,255,0.7) 100%),
        url("data:image/svg+xml,%3Csvg width='200' height='200' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='200' height='200' fill='%23fff' fill-opacity='.01'/%3E%3Ccircle cx='100' cy='100' r='1.2' fill='%23000000' fill-opacity='.06'/%3E%3C/svg%3E");
      background-attachment: fixed;
    }
    html.dark body {
      background:
        linear-gradient(135deg, rgba(15,15,23,1) 0%, rgba(32,25,58,0.93) 100%),
        url("data:image/svg+xml,%3Csvg width='200' height='200' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='200' height='200' fill='%230e0e17' fill-opacity='.02'/%3E%3Ccircle cx='100' cy='100' r='1.4' fill='%23fff' fill-opacity='.07'/%3E%3C/svg%3E");
      background-attachment: fixed;
    }
    .morph-portrait {
      transition: border-radius 1.5s cubic-bezier(.85,-0.7,.54,1.62), box-shadow .7s;
      border-radius: 63% 37% 53% 47% / 47% 52% 48% 53%;
      box-shadow: 0 14px 44px 0 rgba(32,19,53,.19);
      overflow: hidden;
      backdrop-filter: blur(1.5px);
      will-change: border-radius;
    }
    .morph-portrait:hover {
      border-radius: 55% 45% 34% 66% / 41% 61% 39% 59%;
      box-shadow: 0 24px 64px 0 rgba(70,40,120,.16);
    }
    .theme-icon {
      transition: stroke 0.7s, fill 0.7s;
      stroke: currentColor;
      fill: none;
      width: 1.55em;
      height: 1.55em;
      display: block;
    }
    .availability-pill {
      font-size: 0.96rem;
      padding: 0.26rem 1.2rem;
      border-radius: 1.5em;
      font-weight: 500;
      background: linear-gradient(90deg, #b2ffd3 0%, #45a16a 100%);
      color: #094337;
      letter-spacing: 0.05em;
      box-shadow: 0 1.5px 9px 0 rgba(95,183,121,.045);
      display: inline-block;
      transition: background .3s,color .3s;
    }
    html.dark .availability-pill {
      background: linear-gradient(90deg, #002311 0%, #45a16a 100%);
      color: #c2ffde;
    }
    .floating-telegram {
      position: fixed;
      z-index: 51;
      bottom: 2rem;
      right: 2rem;
      background: rgba(245,245,245,0.55);
      backdrop-filter: blur(6px);
      border-radius: 2em;
      box-shadow: 0 2px 16px 0 rgba(90,60,120,.055);
      color: #2870f9;
      padding: 0.78em 1.25em 0.78em 1.25em;
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 500;
      font-size: 1.13rem;
      transition: background .3s, color .3s, box-shadow .3s;
      text-decoration: none;
      cursor: pointer;
    }
    .floating-telegram:hover {
      background: rgba(214,232,255,0.86);
      color: #176e9c;
      box-shadow: 0 7px 28px 0 rgba(60,114,250,0.14);
    }
    html.dark .floating-telegram {
      background: rgba(22,34,56,0.80);
      color: #67b6fc;
    }
    html.dark .floating-telegram:hover {
      background: rgba(22,34,56,0.93);
      color: #44aff7;
    }

    .floating-telegram span {
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s;
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.95em;
      color: #404040;
      background: #fcfcfc;
      padding: .55em .85em;
      border-radius: 1em;
      box-shadow: 0 2px 8px rgba(55,44,72,0.09);
      white-space: nowrap;
      z-index: 99;
    }
    .floating-telegram:hover span {
      opacity: 1;
    }
    html.dark .floating-telegram span {
      color: #bfeaff;
      background: #1e2329;
    }
    .section-fade {
      opacity: 0;
      transform: translateY(36px);
      transition: opacity 1.1s, transform 1.1s;
      will-change: opacity,transform;
    }
    .section-fade.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .social-link {
      position: relative;
      width: 1.5em;
      height: 1.5em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 100vw;
      transition: background .19s;
      color: #444;
    }
    .social-link:hover {
      color: #0055be;
      background: rgba(45, 61, 160, 0.09);
    }
    html.dark .social-link {
      color: #ccc;
    }
    html.dark .social-link:hover {
      color: #77cfff;
    }
    @media (max-width: 768px) {
      .floating-telegram {
        bottom: 1.2rem;
        right: 1.05rem;
        padding: 0.68em 1em 0.68em 1em;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col">

  <!-- Social Links & Theme -->
  <header class="fixed top-0 left-0 w-full flex justify-between z-40 pointer-events-none">
    <div class="p-6 pl-8 flex gap-3 pointer-events-auto">
      <a href="https://instagram.com/jay.merete" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" class="w-5 h-5"><rect x="4.7" y="4.7" width="14.6" height="14.6" rx="4.3" stroke="currentColor"/><circle cx="12" cy="12" r="4" stroke="currentColor"/><circle cx="17" cy="7" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="mailto:yididyamerete@gmail.com" class="social-link" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" class="w-5 h-5"><rect x="3.5" y="6" width="17" height="12" rx="2.8" stroke="currentColor"/><path d="M5 8l7 5.5L19 8" stroke="currentColor"/></svg>
      </a>
    </div>
    <div class="p-6 pr-8 pointer-events-auto">
      <button id="themeToggle"
        class="inline-flex items-center justify-center rounded-full border border-gray-200 dark:border-gray-800 shadow-sm transition-all bg-white/50 dark:bg-zinc-900/70 hover:bg-zinc-100 dark:hover:bg-zinc-700 w-[2.5em] h-[2.5em] min-w-[2.5em] min-h-[2.5em] focus:outline-none focus:ring-2 focus:ring-cyan-400"
        aria-label="Toggle dark mode"
        type="button">
        <svg id="themeIcon" viewBox="0 0 24 24" class="theme-icon"></svg>
      </button>
    </div>
  </header>

  <!-- Write a Message (Telegram) -->
  <a href="https://t.me/jaymerete" target="_blank" rel="noopener noreferrer" class="floating-telegram" aria-label="Write me a message on Telegram">
    <svg viewBox="0 0 26 26" fill="none" stroke-width="1.8" style="width:1.3em; height:1.3em;stroke:currentColor;">
      <circle cx="13" cy="13" r="12.2" stroke="currentColor" fill="none"/>
      <path d="M7 13l4.1 3.3c.2.2.6.2.7 0l6.1-7.6" stroke="currentColor" stroke-linecap="round"/>
    </svg>
    <span>Write me a message!</span>
  </a>

  <!-- Hero Section -->
  <main class="flex flex-1 flex-col items-center justify-center w-full px-4 pt-32 relative z-10">
    <section class="w-full max-w-5xl mx-auto flex flex-col md:flex-row items-center gap-12 md:gap-24 section-fade" style="min-height: 65vh;">
      <!-- Portrait & name -->
      <div class="flex flex-col items-center md:items-start flex-shrink-0">
        <div class="morph-portrait w-44 h-60 bg-zinc-300 dark:bg-zinc-700 flex items-center justify-center shadow-2xl group transition-all relative">
          <img src="your-photo.jpg" alt="Jay Merete, portrait"
            class="w-full h-full object-cover object-top transition-all duration-700 group-hover:scale-105" style="aspect-ratio:3/4;">
        </div>
        <h1 class="mt-7 mb-2 text-4xl md:text-5xl font-bold tracking-tight leading-none text-zinc-800 dark:text-zinc-100 drop-shadow-sm text-center md:text-left">
          Jay Merete
        </h1>
        <div class="availability-pill mt-2" id="availablePill" role="status" aria-live="polite">
          Available for hire
        </div>
      </div>
      <!-- Bio & extras -->
      <div class="flex-1 flex flex-col justify-center items-center md:items-start">
        <div class="pl-0 md:pl-2">
          <p class="text-lg sm:text-xl text-zinc-700 dark:text-zinc-300 font-normal leading-relaxed mb-4 text-center md:text-left">
            Visual storyteller & creative mind — blending reality and dreams into unique narratives.
            <br>
            I direct, write, coordinate, and guide stories across television, commercial, and visual spaces.
          </p>
          <div class="mt-2 flex flex-row items-center justify-center md:justify-start gap-4">
            <span class="inline-block px-3 py-1 text-xs rounded-lg bg-zinc-200/80 dark:bg-zinc-700/60 text-zinc-900 dark:text-zinc-100">Addis Ababa, Ethiopia</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Minimal and properly centered moon path in 24x24 viewBox!
    const SUN = `<circle cx="12" cy="12" r="5" stroke="currentColor" fill="none"/><g stroke="currentColor"><line x1="12" y1="3" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="3" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="21" y2="12"/><line x1="5.8" y1="5.8" x2="7.6" y2="7.6"/><line x1="16.4" y1="16.4" x2="18.2" y2="18.2"/><line x1="5.8" y1="18.2" x2="7.6" y2="16.4"/><line x1="16.4" y1="7.6" x2="18.2" y2="5.8"/></g>`;
    // Moon is a simple crescent completely inside 24x24:
    const MOON = `<path d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" stroke="currentColor" fill="none"/>`;

    document.addEventListener("DOMContentLoaded", function () {
      // Theme toggle
      const toggleBtn = document.getElementById("themeToggle");
      const icon = document.getElementById("themeIcon");
      const html = document.documentElement;
      const storage = localStorage;
      function setTheme(mode) {
        if (mode === "dark") {
          html.classList.add("dark");
          icon.innerHTML = MOON;
        } else {
          html.classList.remove("dark");
          icon.innerHTML = SUN;
        }
      }
      let savedTheme = storage.getItem("theme");
      if (!savedTheme) {
        savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
      }
      setTheme(savedTheme);
      toggleBtn.addEventListener("click", () => {
        if (html.classList.contains("dark")) {
          setTheme("light");
          storage.setItem("theme", "light");
        } else {
          setTheme("dark");
          storage.setItem("theme", "dark");
        }
      });
      // Fade-in
      document.querySelectorAll('.section-fade').forEach((el, i) => {
        setTimeout(() => el.classList.add('visible'), 120 + i*130);
      });
    });
  </script>
</body>
</html>
